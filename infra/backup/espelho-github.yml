# Robô de backup do repositório do SCL. Este arquivo é copiado para o repositório de backup,
# em OUTRA conta do GitHub, no caminho .github/workflows/backup.yml. Aqui, em infra/backup/,
# ele é só o original guardado: não roda neste repositório.
#
# Como funciona (detalhes em requisitos/operations/BACKUP-E-RECUPERACAO.md):
# - A cada 3 dias (e quando acionado à mão), baixa todas as branches e tags da origem com um
#   token SÓ DE LEITURA e grava neste repositório sob o prefixo `espelho/`.
# - Nunca apaga nem reescreve o que já está aqui: só avança. Branch apagada na origem continua
#   aqui; branch reescrita na origem fica como estava aqui (a versão nova fica na tag datada).
# - Cada rodada cria uma tag `backup/AAAA-MM-DD-HHMM` apontando para um "retrato": um commit cuja
#   árvore é a da `main` da origem e cujos pais são o retrato anterior e TODAS as pontas da origem
#   (branches e tags), com um inventário na mensagem (cada branch e tag da origem com seu commit, e
#   tudo o que este repositório guarda). A branch `backup-marcos` aponta sempre para o último
#   retrato: é a linha do tempo dos retratos e a base da comparação. Uma ref reescrita na origem
#   é guardada tal como está sob `recusadas/<data>/...`, para o objeto exato (inclusive tag
#   anotada) continuar alcançável. Nada fica solto para o Git limpar.
# - Comparando com o inventário do retrato anterior, o robô falha (o GitHub manda e-mail para a
#   conta de backup) quando: algo sumiu da origem; algo foi reescrito na origem; algo sumiu deste
#   backup (inclusive tags backup/ e o ponteiro backup-marcos). Cada ocorrência avisa uma vez só.
#
# Segredos deste repositório de backup (Settings → Secrets and variables → Actions):
# - ORIGEM_REPO  = dono/repositorio da origem (ex.: empresa/sistema)
# - ORIGEM_TOKEN = fine-grained token da conta principal: só este repositório, só leitura
#                  (Contents: Read-only). Nada de escrita, nada de administração.
# Nenhum dado da conta de backup aparece neste arquivo nem no repositório de origem.
name: Backup do repositório de origem

on:
  schedule:
    - cron: "17 6 */3 * *" # a cada 3 dias, 03:17 em Brasília (06:17 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  espelhar:
    name: Espelhar a origem neste repositório
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Conferir segredos
        env:
          ORIGEM_REPO: ${{ secrets.ORIGEM_REPO }}
          ORIGEM_TOKEN: ${{ secrets.ORIGEM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ORIGEM_REPO}" ] || [ -z "${ORIGEM_TOKEN}" ]; then
            echo "::error::Faltam os segredos ORIGEM_REPO e/ou ORIGEM_TOKEN neste repositório."
            exit 1
          fi
          case "${ORIGEM_REPO}" in
            */*) ;;
            *) echo "::error::ORIGEM_REPO deve ter o formato dono/repositorio."; exit 1 ;;
          esac

      - name: Baixar tudo da origem (só leitura)
        env:
          ORIGEM_REPO: ${{ secrets.ORIGEM_REPO }}
          ORIGEM_TOKEN: ${{ secrets.ORIGEM_TOKEN }}
        run: |
          set -euo pipefail
          # Credencial vai no cabeçalho HTTP, nunca na URL: não aparece em mensagens de erro.
          auth="AUTHORIZATION: basic $(printf '%s' "x-access-token:${ORIGEM_TOKEN}" | base64 -w0)"
          origem="${ORIGEM_URL:-https://github.com/${ORIGEM_REPO}.git}"
          git init -q --bare espelho.git
          cd espelho.git
          git -c "http.extraheader=${auth}" fetch -q --no-tags "${origem}" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          echo "Branches baixadas: $(git for-each-ref refs/heads | wc -l); tags: $(git for-each-ref refs/tags | wc -l)"
          if ! git rev-parse --verify -q refs/heads/main >/dev/null; then
            echo "::error::A origem não tem a branch main."
            exit 1
          fi

      - name: Gravar neste repositório sem apagar nem reescrever nada
        env:
          DESTINO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd espelho.git
          auth="AUTHORIZATION: basic $(printf '%s' "x-access-token:${DESTINO_TOKEN}" | base64 -w0)"
          destino="${DESTINO_URL:-https://github.com/${GITHUB_REPOSITORY}.git}"
          marco="backup/$(TZ=America/Sao_Paulo date +%Y-%m-%d-%H%M)"
          robo() { git -c user.name=robo -c user.email=robo@backup.invalid "$@"; }
          no_destino() { git -c "http.extraheader=${auth}" "$@"; }

          # O que este repositório já guarda, trazido para refs/guardado/ (traz também a história
          # antiga, para reconhecer uma reescrita na origem). Se a leitura falhar, a rodada para:
          # sem essa visão a comparação ficaria cega e a rodada seguinte tomaria o vazio por base.
          no_destino fetch -q --no-tags "${destino}" \
            '+refs/heads/espelho/*:refs/guardado/heads/*' '+refs/tags/espelho/*:refs/guardado/tags/*' \
            '+refs/tags/backup/*:refs/guardado/backup/*' '+refs/tags/recusadas/*:refs/guardado/recusadas/*'
          ponteiro=$(no_destino ls-remote "${destino}" refs/heads/backup-marcos | awk '{print $1}')
          if [ -n "${ponteiro}" ]; then
            no_destino fetch -q --no-tags "${destino}" '+refs/heads/backup-marcos:refs/guardado/marcos'
          fi
          {
            git for-each-ref --format='%(refname)' refs/guardado/heads refs/guardado/tags | sed 's#^refs/guardado/#refs/#'
            git for-each-ref --format='%(refname)' refs/guardado/backup | sed 's#^refs/guardado/backup/#refs/tags/backup/#'
            git for-each-ref --format='%(refname)' refs/guardado/recusadas | sed 's#^refs/guardado/recusadas/#refs/tags/recusadas/#'
            if [ -n "${ponteiro}" ]; then echo refs/heads/backup-marcos; fi
          } | sort > guardado.refs
          # Marcos datados existentes (só os do formato backup/AAAA-MM-DD-HHMM).
          grep -E '^refs/tags/backup/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}$' guardado.refs | sort > marcos.refs || true

          # Rodada anterior = retrato apontado por backup-marcos. Sem o ponteiro, o marco mais novo
          # (e avisa); sem marco algum mas com conteúdo espelhado, todos os marcos foram apagados.
          anterior=""; ponteiro_apagado=0; marcos_apagados=0
          if [ -n "${ponteiro}" ]; then
            anterior=refs/guardado/marcos
          elif [ -s marcos.refs ]; then
            anterior=$(tail -n1 marcos.refs | sed 's#^refs/tags/backup/#refs/guardado/backup/#'); ponteiro_apagado=1
          elif [ -s guardado.refs ]; then
            marcos_apagados=1
          fi

          # Inventário desta rodada, parte 1: qual é o marco e a origem (commit e nome de cada ref).
          echo "marco refs/tags/${marco}" > inventario.txt
          git for-each-ref --format='origem %(objectname) %(refname)' refs/heads refs/tags >> inventario.txt
          awk '$1 == "origem" {print $3}' inventario.txt | sort > atual.refs

          # Comparação com o inventário do retrato anterior.
          sumiram_da_origem=""; sumiram_do_backup=""; reescritas=""
          if [ -n "${anterior}" ]; then
            git for-each-ref --format='%(contents)' "${anterior}" > anterior.txt
            awk '$1 == "origem" && NF == 3 {print $3}' anterior.txt | sort > anterior-origem.refs
            awk '$1 == "backup" && NF == 2 {print $2}' anterior.txt | sort > anterior-backup.refs
            sumiram_da_origem=$(comm -23 anterior-origem.refs atual.refs || true)
            sumiram_do_backup=$(comm -23 anterior-backup.refs guardado.refs || true)
            # Reescrita: branch cujo commit de antes não é antepassado do de agora; tag que mudou de objeto.
            while read -r _ sha_antes ref; do
              sha_agora=$(git rev-parse -q --verify "${ref}" 2>/dev/null || true)
              [ -z "${sha_agora}" ] && continue
              case "${ref}" in
                refs/tags/*)
                  [ "${sha_agora}" != "${sha_antes}" ] && reescritas="${reescritas}${ref}"$'\n' ;;
                *)
                  antes=$(git rev-parse -q --verify "${sha_antes}^{commit}" 2>/dev/null || true)
                  agora=$(git rev-parse -q --verify "${sha_agora}^{commit}" 2>/dev/null || true)
                  if [ -z "${antes}" ] || [ -z "${agora}" ] || ! git merge-base --is-ancestor "${antes}" "${agora}"; then
                    reescritas="${reescritas}${ref}"$'\n'
                  fi ;;
              esac
            done < <(awk '$1 == "origem" && NF == 3' anterior.txt)
          fi

          # Destinos das refs reescritas (gravados nesta rodada, antes da base avançar).
          recusadas_destinos=""
          if [ -n "${reescritas}" ]; then
            recusadas_destinos=$(printf '%s' "${reescritas}" | sed '/^$/d' | sed "s#^refs/#refs/tags/recusadas/${marco#backup/}/#")
          fi
          # Cópias recusadas/ que sumiram deste backup: regravar a partir da origem, se ela ainda tiver a ref.
          recriadas=()
          if [ -n "${sumiram_do_backup}" ]; then
            while read -r dest; do
              case "${dest}" in refs/tags/recusadas/*/heads/*|refs/tags/recusadas/*/tags/*) ;; *) continue ;; esac
              src="refs/${dest#refs/tags/recusadas/*/}"
              if git rev-parse -q --verify "${src}" >/dev/null; then recriadas+=("${src}:${dest}"); fi
            done <<< "${sumiram_do_backup}"
          fi
          # Inventário, parte 2: o que este backup guarda depois desta rodada (inclusive o que ela cria).
          {
            cat guardado.refs atual.refs
            echo "refs/tags/${marco}"
            echo refs/heads/backup-marcos
            if [ -n "${recusadas_destinos}" ]; then echo "${recusadas_destinos}"; fi
            for spec in "${recriadas[@]}"; do echo "${spec#*:}"; done
          } | sort -u | sed 's/^/backup /' >> inventario.txt

          # Retrato da rodada: árvore da main; pais = retrato anterior, main e todas as outras pontas
          # (commits); mensagem = inventário. Tudo o que o inventário cita fica alcançável por aqui.
          main=$(git rev-parse "refs/heads/main^{commit}")
          pais=()
          if [ -n "${anterior}" ]; then pais+=(-p "$(git rev-parse "${anterior}^{commit}")"); fi
          pais+=(-p "${main}")
          # Pontas convertidas em commit (tag anotada vira o commit apontado) e sem repetição.
          while read -r c; do
            if [ -n "${c}" ] && [ "${c}" != "${main}" ]; then pais+=(-p "${c}"); fi
          done < <(git for-each-ref --format='%(objectname)' refs/heads refs/tags \
            | while read -r o; do git rev-parse -q --verify "${o}^{commit}" || true; done | sort -u)
          retrato=$(robo commit-tree "${main}^{tree}" "${pais[@]}" -F inventario.txt)
          git update-ref "refs/marcos/${marco}" "${retrato}"

          # 1) Refs reescritas nesta rodada: guardar o objeto exato (inclusive tag anotada ou de blob) sob
          #    recusadas/<data>/..., ANTES de avançar a base de comparação. Se falhar, a rodada para aqui e a
          #    próxima tenta de novo (a ref continua "reescrita" frente à base antiga).
          if [ -n "${reescritas}" ]; then
            specs=()
            while read -r ref; do
              [ -n "${ref}" ] && specs+=("${ref}:refs/tags/recusadas/${marco#backup/}/${ref#refs/}")
            done <<< "${reescritas}"
            no_destino push -q "${destino}" "${specs[@]}"
          fi
          if [ "${#recriadas[@]}" -gt 0 ]; then
            no_destino push -q "${destino}" "${recriadas[@]}"
          fi

          # 2) Espelho, sem --force e sem --prune: só avança. O que a origem apagou continua aqui; o que
          #    ela reescreveu é recusado (linha começando com "!") e fica como estava.
          set +e
          no_destino push --porcelain "${destino}" \
            'refs/heads/*:refs/heads/espelho/*' \
            'refs/tags/*:refs/tags/espelho/*' > push.log 2> push.err
          codigo=$?
          set -e
          grep -v '^To ' push.log || true
          if [ "${codigo}" -ne 0 ] && ! grep -q '^!' push.log; then
            cat push.err
            echo "::error::O push do espelho para este repositório falhou (código ${codigo})."
            exit "${codigo}"
          fi
          # Só se aceita recusa por divergência da origem (non-fast-forward, fetch first, already exists).
          # Qualquer outra (regra do repositório, hook, falha do servidor) para a rodada antes de avançar a base.
          inesperadas=$(awk -F'\t' '$1 == "!" && $3 !~ /^\[rejected\] \((non-fast-forward|fetch first|already exists)\)/' push.log || true)
          if [ -n "${inesperadas}" ]; then
            cat push.err || true
            echo "::error::Recusas inesperadas no push do espelho (não são divergência da origem). A base de comparação não mudou; o espelho pode estar incompleto:"
            echo "${inesperadas}"
            exit 1
          fi
          if grep -q '^!' push.log; then
            echo "::warning::Refs recusadas (a origem diverge do que está guardado): este backup manteve a versão anterior em espelho/...; a versão atual da origem está alcançável pela tag ${marco}."
          fi

          # 3) Marco e ponteiro juntos (--atomic): ou os dois entram, ou nenhum. A base de comparação nunca
          #    fica à frente do que já foi guardado.
          if ! no_destino push -q --atomic "${destino}" \
            "refs/marcos/${marco}:refs/tags/${marco}" \
            "refs/marcos/${marco}:refs/heads/backup-marcos"; then
            echo "::error::Não foi possível gravar ${marco} e backup-marcos (já existe uma rodada neste mesmo minuto, ou uma regra do repositório recusou). A base de comparação não mudou; rode de novo em outro minuto."
            exit 1
          fi
          echo "Marco desta rodada: ${marco}"

          # Avisos (a rodada falha, e o GitHub manda e-mail para a conta de backup). Cada mudança
          # avisa uma vez só: o inventário novo já a reflete.
          falhou=0
          if [ -n "${reescritas}" ]; then
            echo "::error::Branches/tags REESCRITAS na origem desde a rodada anterior (este backup manteve a história antiga em espelho/...; a nova está alcançável pela tag ${marco}):"
            printf '%s' "${reescritas}"
            falhou=1
          fi
          if [ -n "${sumiram_da_origem}" ]; then
            echo "::error::Branches/tags que SUMIRAM DA ORIGEM desde a rodada anterior (continuam guardadas aqui como espelho/...):"
            echo "${sumiram_da_origem}"
            falhou=1
          fi
          if [ -n "${sumiram_do_backup}" ]; then
            echo "::error::Branches/tags que SUMIRAM DESTE BACKUP desde a rodada anterior (alguém apagou aqui; o que a origem ainda tem foi gravado de novo):"
            echo "${sumiram_do_backup}"
            falhou=1
          fi
          if [ "${ponteiro_apagado}" -eq 1 ]; then
            echo "::error::A branch backup-marcos (ponteiro para o último retrato) havia sido apagada deste repositório. Foi recriada a partir do marco mais novo que restou; confira se algum marco também sumiu."
            falhou=1
          fi
          if [ "${marcos_apagados}" -eq 1 ]; then
            echo "::error::Este repositório tinha conteúdo espelhado e NENHUMA tag backup/: todos os marcos datados foram apagados aqui. Esta rodada criou um marco novo (${marco}); os anteriores não voltam."
            falhou=1
          fi
          exit "${falhou}"
