name: SCL tests
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: scl-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: SCL Node 22 tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Protótipo site público
        working-directory: prototipos/scl-publico
        run: node --test test/*.test.mjs
      - name: Protótipo gestão
        working-directory: prototipos/scl-gestao-demo
        run: node --test test/*.test.mjs

  app:
    name: SCL app (lint, typecheck, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
