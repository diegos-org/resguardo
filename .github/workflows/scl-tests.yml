name: SCL tests
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: scl-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: SCL Node 22 tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Protótipo site público
        working-directory: prototipos/scl-publico
        run: node --test test/*.test.mjs
      - name: Protótipo gestão
        working-directory: prototipos/scl-gestao-demo
        run: node --test test/*.test.mjs

  app:
    name: SCL app (lint, typecheck, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # O commit de merge do PR e os dois pais: o bastante para listar o que o PR muda.
          fetch-depth: 2
      # M0.8: PR que não mexe em app/ (só documentação, roadmap, guia, infra/) não roda lint,
      # typecheck, testes nem build do app. O job continua existindo e fica verde, então vale
      # como check obrigatório. Mudança no próprio workflow roda tudo. Sem commit de merge
      # (caso raro), roda tudo.
      - name: O que o PR muda
        id: mudancas
        working-directory: .
        run: |
          if ! git rev-parse -q --verify 'HEAD^2' >/dev/null 2>&1; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem commit de merge para comparar; rodando tudo."
            exit 0
          fi
          arquivos=$(git diff --name-only 'HEAD^1' HEAD)
          printf 'Arquivos do PR:\n%s\n' "${arquivos}"
          if printf '%s\n' "${arquivos}" | grep -qE '^(app/|\.github/workflows/scl-tests\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nenhuma mudança em app/ neste PR: lint, typecheck, testes e build do app não rodam (M0.8)."
          fi
      - name: Node 22
        if: steps.mudancas.outputs.app == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        if: steps.mudancas.outputs.app == 'true'
      - run: npm run lint
        if: steps.mudancas.outputs.app == 'true'
      - run: npm run typecheck
        if: steps.mudancas.outputs.app == 'true'
      - run: npm test
        if: steps.mudancas.outputs.app == 'true'
      - run: npm run build
        if: steps.mudancas.outputs.app == 'true'
        env:
          NEXT_TELEMETRY_DISABLED: '1'
